{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Market Overview</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Coin</th>
                            <th>Symbol</th>
                            <th>Current Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Bitcoin</td>
                            <td>BTC</td>
                            <td>£50,000.00</td>
                            <td><button class="btn btn-sm btn-outline-primary">Trade</button></td>
                        </tr>
                        <tr>
                            <td>Ethereum</td>
                            <td>ETH</td>
                            <td>£2,500.00</td>
                            <td><button class="btn btn-sm btn-outline-primary">Trade</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
