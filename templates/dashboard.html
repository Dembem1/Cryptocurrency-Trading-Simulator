{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Market Overview</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <tbody>
                        <div class="row">
                            {% for coin in prices %}
                            <div class="col-md-4 mb-3">
                                <div class="card shadow-sm p-3">
                                    <img src="{{ coin.image }}" 
                                    alt="{{ coin.name }}" 
                                    width="40" 
                                    height="40"
                                    class="me-3">
                                    <h5>{{ coin.name }}</h5>
                                    <p>{{ coin.symbol }}</p>
                                    <p>${{ coin.current_price }}</p>

                                    <form method="POST">
                                        <input type="hidden" name="coin_name" value="{{ coin.id }}">

                                        <input type="hidden" name="action" value="buy">

                                        <input type="number" step="0.0001" name="amount" placeholder="Amount" class="form-control mb-2">

                                        <button type="submit" class="btn btn-success btn-sm">
                                            Buy {{ coin.symbol.upper() }}
                                        </button>
                                    </form>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
