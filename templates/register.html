{% extends "layout.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 bg-dark text-white border-secondary shadow" style="width: 100%; max-width: 400px;">
        
        <h3 class="text-center mb-4">Register</h3>

        <form method="POST">
            
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control bg-dark text-white border-secondary" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-3 text-muted">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-primary">Login</a>
        </p>

    </div>
</div>
{% endblock %}
