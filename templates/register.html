{% extends "layout.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card p-4 bg-dark text-white border-secondary shadow" style="width: 100%; max-width: 400px;">
        
        <h3 class="text-center mb-4">Register</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            
            <div class="mb-3">
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Username" required>
            </div>

            <div class="mb-3">
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-3 text-muted">
            Have an account?
            <a href="/">Log in</a>
        </p>

    </div>

</div>

{% endblock %}
