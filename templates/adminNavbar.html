<!-- sidebar section -->
<!-- admin side bar with Dashboard, Manage Users, Manage Coins and System Logs-->
<nav class="sidebar">

    <h4 class="logo">Logo</h4>

    <ul class="nav-list">

        <li>
            <a href="{{ url_for('admin_dashboard', username=username) }}">
                Dashboard
            </a>
        </li>

        <li>
            <a href="{{ url_for('manage_users', username=username) }}">
                Manage Users
            </a>
        </li>

        <li>
            <a href="{{ url_for('manage_coins', username=username) }}">
                Manage Coins
            </a>
        </li>
        
        <li>
            <a href="{{ url_for('logs', username=username) }}">
                System Logs
            </a>
        </li>
        
        <li>
            <a href="{{ url_for('index') }}" class="logout">
                Logout
            </a>
        </li>

    </ul>

</nav>

<!-- topbar section -->
<nav class="topbar">

    <span class="page_title">
        {{ title }}
    </span> <!-- pass a title from a page -->

    <div class="topbar-right">

        <span class="balance">
            Balance: ${{ balance }}
        </span>

        <span class="username">
            {{ username }}
        </span>

    </div>

</nav>

<!-- theme bar section -->
<nav class="theme-bar">

<button id="themeToggle" class="btn btn-outline-secondary btn-sm">

Dark Mode

</button>
</nav>
