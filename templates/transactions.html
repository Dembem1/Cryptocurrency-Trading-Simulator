{% extends "layout.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Transaction History</h5>
        <div class="btn-group">
            <button class="btn btn-sm btn-outline-secondary">Buy</button>
            <button class="btn btn-sm btn-outline-secondary">Sell</button>
        </div>
    </div>
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Date</th><th>Coin</th><th>Type</th><th>Amount</th><th>Price</th><th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2026-02-10</td><td>BTC</td><td><span class="text-success">BUY</span></td><td>0.02</td><td>£50,000</td><td>£1,000</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
