<!-- link layout.html -->
{% extends "layout.html" %}

<!-- pass title for topbar navigation -->
{% set title = "Transactions" %}

<!-- give name to a title-->
{% block title %}
Transactions
{% endblock %}

<!-- add a content to the body block-->
{% block content %}
<div class="container-fluid">

<h2 class="mb-4">Transactions</h2>

<!-- top buttons -->
<div class="d-flex justify-content-between mb-3">

<button class="btn btn-outline-secondary" id="sortButton">
Sort
</button>

<button class="btn btn-primary" id="buyCoinButton">
Buy Coin
</button>

</div>

<!-- transactions table -->
<div class="card">

<div class="card-body">

<table class="table table-striped">

<thead>

<tr>

<th>Date</th>
<th>Coin</th>
<th>Type</th>
<th>Amount</th>
<th>Price</th>
<th>Total</th>

</tr>

</thead>

<tbody id="transactionsTable">

<!-- empty state -->

<tr>

<td colspan="6" class="text-center">
No transactions yet
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>
{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>

{% endblock %}
