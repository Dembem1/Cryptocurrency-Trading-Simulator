{% extends "layout.html" %}
{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form class="row g-3">
            <div class="col-auto"><input type="text" class="form-control" placeholder="Enter Coin Symbol (e.g. btc)"></div>
            <div class="col-auto"><button type="submit" class="btn btn-primary">Add Coin</button></div>
        </form>
    </div>
</div>
<div class="card shadow-sm">
    <div class="card-body">
        <h6>Supported Coins</h6>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">Bitcoin (BTC) <button class="btn btn-sm text-danger">Remove</button></li>
        </ul>
    </div>
</div>
{% endblock %}
